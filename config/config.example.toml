# GopherPaper 科研文献智能解析与知识服务系统 —— 配置示例
# 复制为 config/config.toml 后修改（config.toml 已被 .gitignore 忽略）

[server]
addr = ":8080"
mode = "debug" # debug / release

[log]
level = "info"         # debug / info / warn / error
file = "log/app.log"   # 留空输出到 stdout；填路径则按日期切分写入该目录（自动建目录、追加写），实际文件名形如 log/app-2006-01-02.log
max_size_mb = 100      # 单个日志文件大小上限（MB），超额同日滚动到 app-2006-01-02.1.log，缺省 100
max_backups = 30       # 保留的历史日志文件数，超出按修改时间清理最旧的，缺省 30；总占用约束在 max_backups×max_size_mb

# ── Host 意图路由小模型：火山方舟直连，与下游解耦可单独换小模型 ──
[models.intent]
provider = "openai"                                   # openai 兼容端点
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "your-ark-api-key"
model = "doubao-seed-2-0-mini-260215"                 # 小杯，分类任务够用且延迟低
max_tokens = 4096                                     # 输出上限，推理模型须配足(reasoning token 也算)，0/省略走默认
thinking = "disabled"                                 # 关思考，分类要快、不需要推理

# ── 下游问答 / 抽取 / 报告 agent 的主力大模型：火山方舟直连 ────
[models.chat]
provider = "openai"                                   # openai 兼容端点
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "your-ark-api-key"
model = "doubao-seed-2-0-pro-260215"
max_tokens = 16384                                    # 含 reasoning token，推理模型须配足避免 JSON 截断
thinking = "disabled"                                 # 关思考，问答首 token 快、抽取/报告省额度；要质量可改 enabled

# ── 带图推理视觉模型：解析期给图片生成描述、问答期把召回图片喂模型 ──
[models.vlm]
provider = "openai"                                   # openai 兼容端点
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "your-ark-api-key"
model = "doubao-seed-2-0-pro-260215"                  # 须为多模态模型，可与 chat 同款
max_tokens = 16384
thinking = "disabled"                                 # 关思考，图描述生成走批量解析期，快为先

# ── 小云雀 agent 模型:多轮工具循环对延迟敏感,整块留空回退 models.chat ──
[models.pioneer]
provider = "openai"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "your-ark-api-key"
model = "doubao-seed-2-0-pro-260215"
max_tokens = 8192
thinking = "disabled"                                 # 关思考，多轮工具循环每轮都省一段推理延迟

# ── 翻译小模型：精读页逐段翻译，裸调不挂工具不走 RAG ──────────
[models.translate]
provider = "ollama"                     # 本地 ollama，openai 兼容端点
base_url = "http://localhost:11434/v1"
model = "qwen2.5:1.5b-instruct"         # 通用 instruct 小模型，跟随翻译指令；勿用 coder 版（只会续写）
max_tokens = 4096

# ── ai agent 工具来源:mcp 工具集与 skill 仓库,按 agent 分组 ──
# agent 字段分组:留空给默认论文助教,"pioneer" 给小云雀。
# credential 标记凭据 provider:该工具的 Authorization 不写配置,
# 由前端保存 token、随消息请求头(如 X-Luckin-Token)透传,服务端按调用注入,不落库。
[tools]
skills = []                            # 论文助教的本地 skill 目录
pioneer_skills = ["skills/pioneer"]    # 小云雀的本地 skill 目录
gopher_skills = ["skills/gopher"]      # 小囊鼠研读报告 agent 的检索流程 skill
baidu_map_ak = ""                      # 百度地图开放平台 AK,非空时给小云雀挂 geocode 地理编码工具
baidu_map_sk = ""                      # AK 开了 SN 校验时填对应 SK,留空表示 AK 走 IP 白名单校验
tavily_api_key = ""                    # Tavily 联网搜索密钥,非空时给小云雀挂 web_search 工具,补足实时信息
semantic_scholar_api_key = ""          # Semantic Scholar 检索密钥,可选;官方填 s2k- key(x-api-key),走中转代理填 sk- 令牌(Bearer)
semantic_scholar_base_url = ""          # Semantic Scholar 中转代理基址(如 https://s2api.ominiai.cn/s2),留空走官方(限流极紧)

# 工具显示名映射:原始工具名 → 前端展示名,SSE 推工具调用状态时换用,未配置回退原始名。
# mcp 工具名带 toolset 名前缀,key 要写完整名,如 my-coffee_queryShopList。
[tools.tool_names]
delete_my_paper = "删除我的论文"
geocode = "地点定位"
list_my_papers = "我的论文列表"
web_search = "联网搜索"
search_arxiv = "arXiv 检索"
search_semantic_scholar = "学术检索"
recommend_similar_papers = "相似论文推荐"
get_paper_citations = "查被引论文"
get_paper_references = "查参考文献"
download_paper = "下载论文"
search_my_papers = "检索我的论文"
my-coffee_queryShopList = "查询瑞幸门店"
my-coffee_searchProductForMcp = "搜索瑞幸商品"
my-coffee_queryProductDetailInfo = "查看商品定制项"
my-coffee_switchProduct = "切换商品规格"
my-coffee_previewOrder = "预览订单"
my-coffee_createOrder = "提交订单"
my-coffee_queryOrderDetailInfo = "查询订单状态"
my-coffee_cancelOrder = "取消订单"

# 瑞幸点单 MCP,token 由用户在瑞幸开放平台 https://open.lkcoffee.com/mcp 创建后在前端绑定。
[[tools.mcp]]
name = "my-coffee"
transport = "streamable"
server_url = "https://gwmcp.lkcoffee.com/order/user/mcp"
agent = "pioneer"
credential = "luckin"

# ── RAG 向量化模型：硅基流动 API（OpenAI 兼容）──────────────
[embedding]
provider = "openai"
base_url = "https://api.siliconflow.cn/v1" # trpc openai 兼容 embedder 自动拼 /embeddings
api_key = "sk-xxxx"
model = "Qwen/Qwen3-Embedding-0.6B"
dim = 1024                          # Qwen3-Embedding-0.6B 满维 1024，必须与 Milvus collection 维度一致

# ── RAG 重排模型：硅基流动 rerank API ────────────────────────
# 两阶段检索：向量扩大召回候选，再由 cross-encoder 精排截断。enabled=false 退化纯向量召回。
[rerank]
enabled = true
base_url = "https://api.siliconflow.cn/v1/rerank" # 完整 /rerank 端点（非 /v1）
api_key = "sk-xxxx"
model = "Qwen/Qwen3-Reranker-4B"

# ── Milvus 向量库 ────────────────────────────────────────────
[milvus]
address = "localhost:19530"
username = ""
password = ""
collection = "knowledge_chunks_trpc" # trpc vectorstore 专用 schema,科研基础库与用户论文库共用,按 metadata 字段隔离

# ── PDF 解析：MinerU 在线 API（异步任务制）───────────────────
[parser]
base_url = "https://mineru.net/api/v4"
token = "your-mineru-api-token"
timeout = 60       # 单次 HTTP 超时，秒
poll_interval = 5  # 轮询任务状态间隔，秒
poll_timeout = 600 # 轮询总超时，秒

# ── MySQL：业务数据（用户/论文/元信息/会话）─────────────────
[mysql]
dsn = "gopher:gopher@tcp(localhost:3306)/gopherpaper?charset=utf8mb4&parseTime=True&loc=Local"
max_open_conns = 50
max_idle_conns = 10
conn_max_lifetime = 3600

# ── Redis：会话/缓存/限流 ────────────────────────────────────
[redis]
addr = "localhost:6379"
password = ""
db = 0

[neo4j]
uri = "bolt://localhost:7687"
username = "neo4j"
password = "gopherpaper"
database = "neo4j"

# ── 消息队列(RabbitMQ)：耗时任务异步化 ───────────────────────
[mq]
url = "amqp://gopher:gopher@localhost:5772/"
parse_queue = "paper.parse"   # PDF 解析入库流水线
report_queue = "paper.report" # 研读报告预生成扇出队列
report_concurrency = 6        # 报告消费者并发度,按模型并发配额上调

# ── JWT 鉴权 ─────────────────────────────────────────────────
[jwt]
secret = "change-me-to-a-long-random-secret"  # 生产务必替换为强随机密钥
issuer = "gopherpaper"
expire_hours = 240

# ── SMTP 邮件：发送验证码等 ──────────────────────────────────
[mail]
server_mail = "noreply@example.com"    # 发件邮箱
smtp_host = "smtp.example.com"         # SMTP 服务器
smtp_port = 465                        # SSL 端口
key = "your-smtp-auth-code"            # 授权码或密码
recipient_mail = "user@example.com"    # 测试/默认收件邮箱

# Neo4j 知识图谱:论文关系与研究趋势,按用户隔离
[neo4j]
uri = "bolt://localhost:7687"
username = "neo4j"
password = "gopherpaper"
database = "" # 留空走默认库 neo4j