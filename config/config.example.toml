# GopherPaper 科研文献智能解析与知识服务系统 —— 配置示例
# 复制为 config/config.toml 后修改（config.toml 已被 .gitignore 忽略）

[server]
addr = ":8080"
mode = "debug" # debug / release

[log]
level = "info" # debug / info / warn / error
file = ""      # 留空输出到 stdout

# ── Host 意图路由小模型：走 API，与下游解耦可单独换小模型 ──────
[models.intent]
provider = "openai"
base_url = "https://api.openai.com/v1"
api_key = "sk-xxxx"
model = "gpt-4o-mini"
max_tokens = 4096                      # 输出上限，推理模型须配足(reasoning token 也算)，0/省略走默认

# ── 下游问答 / 抽取 / 报告 agent 的主力大模型：走 API ─────────
[models.chat]
provider = "openai"                    # openai 兼容网关
base_url = "https://api.openai.com/v1"
api_key = "sk-xxxx"
model = "gpt-4o-mini"
max_tokens = 16384                     # openai 分支映射到 max_completion_tokens(含 reasoning)，推理模型须配足避免 JSON 截断
# reasoning_effort = "low"             # 仅 gpt-5/o 系列推理模型有效，结构化输出建议 low，省额度防 reasoning 吃光输出

# ── RAG 向量化模型：本地 ollama ──────────────────────────────
[embedding]
provider = "ollama"
base_url = "http://localhost:11434/v1" # trpc openai 兼容 embedder 走 Ollama 的 /v1 端点
model = "bge-m3"
dim = 1024                          # 必须与 Milvus collection 的向量维度一致

# ── Milvus 向量库 ────────────────────────────────────────────
[milvus]
address = "localhost:19530"
username = ""
password = ""
collection = "knowledge_chunks_trpc" # trpc vectorstore 专用 schema,科研基础库与用户论文库共用,按 metadata 字段隔离

# ── PDF 解析：MinerU 在线 API（异步任务制）───────────────────
[parser]
base_url = "https://mineru.net/api/v4"
token = "your-mineru-api-token"
timeout = 60       # 单次 HTTP 超时，秒
poll_interval = 5  # 轮询任务状态间隔，秒
poll_timeout = 600 # 轮询总超时，秒

# ── MySQL：业务数据（用户/论文/元信息/会话）─────────────────
[mysql]
dsn = "gopher:gopher@tcp(localhost:3306)/gopherpaper?charset=utf8mb4&parseTime=True&loc=Local"
max_open_conns = 50
max_idle_conns = 10
conn_max_lifetime = 3600

# ── Redis：会话/缓存/限流 ────────────────────────────────────
[redis]
addr = "localhost:6379"
password = ""
db = 0

# ── 消息队列(RabbitMQ)：耗时任务异步化 ───────────────────────
[mq]
url = "amqp://gopher:gopher@localhost:5672/"
parse_queue = "paper.parse" # PDF 解析入库流水线

# ── JWT 鉴权 ─────────────────────────────────────────────────
[jwt]
secret = "change-me-to-a-long-random-secret"  # 生产务必替换为强随机密钥
issuer = "gopherpaper"
expire_hours = 240

# ── SMTP 邮件：发送验证码等 ──────────────────────────────────
[mail]
server_mail = "noreply@example.com"    # 发件邮箱
smtp_host = "smtp.example.com"         # SMTP 服务器
smtp_port = 465                        # SSL 端口
key = "your-smtp-auth-code"            # 授权码或密码
recipient_mail = "user@example.com"    # 测试/默认收件邮箱
