      - user
  /user/logout:
    post:
      description: 注销当前登录态，并释放该用户常驻的模型与 agent runner 缓存。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 登出
      tags:
      - user
  /user/register:
    post:
      consumes:
      - application/json
      description: 校验邮箱验证码后创建学生用户。
      parameters:
      - description: 注册参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 注册用户
      tags:
      - user
  /user/send-code:
    post:
      consumes:
      - application/json
      description: 向注册邮箱发送 6 位验证码，验证码有效期 5 分钟。
      parameters:
      - description: 邮箱
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 下发邮箱验证码
      tags:
      - user
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer <JWT>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
