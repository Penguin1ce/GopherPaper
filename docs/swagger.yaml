basePath: /api/v1
definitions:
  constant.AnnotationKind:
    enum:
    - selection
    - freetext
    - drawing
    type: string
    x-enum-varnames:
    - AnnotationKindSelection
    - AnnotationKindFreetext
    - AnnotationKindDrawing
  constant.IntentType:
    enum:
    - chitchat
    - summary
    - method
    - pioneer
    - maodie
    type: string
    x-enum-comments:
      IntentChitchat: 与论文无关的闲聊/寒暄,不走 RAG,直接对话作答
      IntentMethod: 方法/流程/实验设计解读
      IntentSummary: 概括/解释/综述,以及论文中的事实/数据/结论定位
    x-enum-descriptions:
    - 与论文无关的闲聊/寒暄,不走 RAG,直接对话作答
    - 概括/解释/综述,以及论文中的事实/数据/结论定位
    - 方法/流程/实验设计解读
    - ""
    - ""
    x-enum-varnames:
    - IntentChitchat
    - IntentSummary
    - IntentMethod
    - IntentPioneer
    - IntentMaodie
  constant.PaperStatus:
    enum:
    - uploaded
    - parsing
    - extracted
    - indexed
    - ready
    - failed
    type: string
    x-enum-comments:
      PaperExtracted: 结构化抽取完成
      PaperFailed: 解析失败
      PaperIndexed: 已分块入向量库
      PaperParsing: MinerU 解析中
      PaperReady: 全流程就绪
      PaperUploaded: 已上传待解析
    x-enum-descriptions:
    - 已上传待解析
    - MinerU 解析中
    - 结构化抽取完成
    - 已分块入向量库
    - 全流程就绪
    - 解析失败
    x-enum-varnames:
    - PaperUploaded
    - PaperParsing
    - PaperExtracted
    - PaperIndexed
    - PaperReady
    - PaperFailed
  constant.ReportType:
    enum:
    - quickread
    - method
    - result
    - innovation
    - related
    - flow
    type: string
    x-enum-comments:
      ReportInnovation: 创新点与不足分析
      ReportMethod: 研究方法总结
      ReportQuickRead: 论文速读
      ReportRelated: 相关研究/参考文献链接
      ReportResult: 实验结果总结
    x-enum-descriptions:
    - 论文速读
    - 研究方法总结
    - 实验结果总结
    - 创新点与不足分析
    - 相关研究/参考文献链接
    - ""
    x-enum-varnames:
    - ReportQuickRead
    - ReportMethod
    - ReportResult
    - ReportInnovation
    - ReportRelated
    - ReportFlow
  dto.AnnotationCreateRequest:
    properties:
      bounding_rect:
        $ref: '#/definitions/dto.AnnotationRect'
      color:
        type: string
      content_json:
        $ref: '#/definitions/model.JSONMap'
      kind:
        type: string
      note:
        type: string
      page_no:
        minimum: 1
        type: integer
      rects:
        items:
          $ref: '#/definitions/dto.AnnotationRect'
        type: array
      style_json:
        $ref: '#/definitions/model.JSONMap'
      text:
        type: string
      translation:
        type: string
    required:
    - bounding_rect
    - page_no
    type: object
  dto.AnnotationRect:
    properties:
      height:
        type: number
      pageNumber:
        type: integer
      width:
        type: number
      x1:
        type: number
      x2:
        type: number
      y1:
        type: number
      y2:
        type: number
    type: object
  dto.AnnotationUpdateRequest:
    properties:
      bounding_rect:
        $ref: '#/definitions/dto.AnnotationRect'
      color:
        type: string
      content_json:
        $ref: '#/definitions/model.JSONMap'
      note:
        type: string
      rects:
        items:
          $ref: '#/definitions/dto.AnnotationRect'
        type: array
      style_json:
        $ref: '#/definitions/model.JSONMap'
      text:
        type: string
      translation:
        type: string
    type: object
  dto.ChatResponse:
    properties:
      content:
        description: 文本回答
        type: string
      intent:
        description: 命中的聊天意图 chitchat/summary/method/pioneer
        type: string
      meta:
        additionalProperties: {}
        type: object
    type: object
  dto.CreateSessionRequest:
    properties:
      agent_type:
        type: string
      paper_id:
        type: string
      title:
        type: string
    type: object
  dto.GraphStats:
    properties:
      authors:
        type: integer
      citations:
        type: integer
      keywords:
        type: integer
      max_year:
        type: integer
      min_year:
        type: integer
      papers:
        type: integer
    type: object
  dto.GraphTrendsResponse:
    properties:
      by_year:
        items:
          $ref: '#/definitions/dto.YearCount'
        type: array
      keyword_trend:
        items:
          $ref: '#/definitions/dto.KeywordYearCount'
        type: array
    type: object
  dto.KeywordYearCount:
    properties:
      count:
        type: integer
      keyword:
        type: string
      year:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      account:
        type: string
      password:
        type: string
      student_id:
        type: string
    required:
    - password
    type: object
  dto.LoginResponse:
    properties:
      avatar_url:
        type: string
      class_id:
        type: string
      email:
        type: string
      name:
        type: string
      student_id:
        type: string
    type: object
  dto.NameCount:
    properties:
      count:
        type: integer
      name:
        type: string
    type: object
  dto.PaperDetailResponse:
    properties:
      meta:
        $ref: '#/definitions/model.PaperMeta'
      paper:
        $ref: '#/definitions/model.Paper'
      sections:
        items:
          $ref: '#/definitions/model.PaperSection'
        type: array
    type: object
  dto.PaperProgressRequest:
    properties:
      last_page:
        minimum: 0
        type: integer
      total_pages:
        type: integer
    type: object
  dto.PaperProgressResponse:
    properties:
      last_read_page:
        type: integer
      progress:
        type: integer
    type: object
  dto.PaperStatusResponse:
    properties:
      fail_reason:
        type: string
      id:
        type: string
      parse_progress:
        type: integer
      parsed_pages:
        type: integer
      status:
        $ref: '#/definitions/constant.PaperStatus'
      total_pages:
        type: integer
    type: object
  dto.ReadyReportsResponse:
    properties:
      flow_ready:
        type: boolean
      ready:
        items:
          $ref: '#/definitions/constant.ReportType'
        type: array
      running:
        items:
          $ref: '#/definitions/dto.ReportRun'
        type: array
    type: object
  dto.RegisterRequest:
    properties:
      class_id:
        type: string
      code:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      student_id:
        type: string
    required:
    - code
    - email
    - password
    - student_id
    type: object
  dto.RelatedPaper:
    properties:
      id:
        type: string
      score:
        type: integer
      title:
        type: string
      vias:
        items:
          type: string
        type: array
      year:
        type: integer
    type: object
  dto.ReportProgressStep:
    properties:
      phase:
        type: string
      text:
        type: string
    type: object
  dto.ReportRequest:
    properties:
      type:
        description: quickread/method/result/innovation/related
        type: string
    required:
    - type
    type: object
  dto.ReportRun:
    properties:
      failed:
        type: boolean
      live:
        type: boolean
      steps:
        items:
          $ref: '#/definitions/dto.ReportProgressStep'
        type: array
      type:
        $ref: '#/definitions/constant.ReportType'
    type: object
  dto.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  dto.SendCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.SendMessageRequest:
    type: object
  dto.TokenRequest:
    properties:
      class_id:
        type: string
      student_id:
        type: string
    required:
    - student_id
    type: object
  dto.TokenResponse:
    properties:
      token:
        type: string
    type: object
  dto.TranslateRequest:
    properties:
      text:
        description: 待翻译的英文原文
        type: string
    required:
    - text
    type: object
  dto.TranslateResponse:
    properties:
      translation:
        type: string
    type: object
  dto.YearCount:
    properties:
      count:
        type: integer
      year:
        type: integer
    type: object
  model.AnnotationRect:
    properties:
      height:
        type: number
      pageNumber:
        type: integer
      width:
        type: number
      x1:
        type: number
      x2:
        type: number
      y1:
        type: number
      y2:
        type: number
    type: object
  model.JSONMap:
    additionalProperties: {}
    type: object
  model.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      intent:
        $ref: '#/definitions/constant.IntentType'
      meta:
        additionalProperties: {}
        description: 助教消息的出处等结构化数据,随 Session 事件持久化与还原
        type: object
      role:
        type: string
      session_id:
        type: string
    type: object
  model.Paper:
    properties:
      category:
        type: string
      created_at:
        type: string
      fail_reason:
        type: string
      file_name:
        type: string
      file_uri:
        type: string
      id:
        type: string
      keywords:
        description: 非表列 从 paper_meta 回填供前端筛选
        items:
          type: string
        type: array
      last_read_page:
        description: 最近阅读到的页码
        type: integer
      owner_id:
        type: string
      page_count:
        type: integer
      parse_progress:
        description: MinerU parse progress 0-100
        type: integer
      parsed_pages:
        description: MinerU parsed pages
        type: integer
      progress:
        description: 阅读进度 0-100
        type: integer
      size:
        type: integer
      status:
        $ref: '#/definitions/constant.PaperStatus'
      title:
        type: string
      total_pages:
        description: MinerU total pages
        type: integer
      updated_at:
        type: string
    type: object
  model.PaperAnnotation:
    properties:
      bounding_rect:
        $ref: '#/definitions/model.AnnotationRect'
      color:
        type: string
      content_json:
        $ref: '#/definitions/model.JSONMap'
      created_at:
        type: string
      id:
        type: integer
      kind:
        $ref: '#/definitions/constant.AnnotationKind'
      note:
        type: string
      owner_id:
        type: string
      page_no:
        type: integer
      paper_id:
        type: string
      rects:
        items:
          $ref: '#/definitions/model.AnnotationRect'
        type: array
      style_json:
        $ref: '#/definitions/model.JSONMap'
      text:
        type: string
      translation:
        type: string
      updated_at:
        type: string
    type: object
  model.PaperMeta:
    properties:
      abstract:
        type: string
      affiliations:
        items:
          type: string
        type: array
      authors:
        items:
          type: string
        type: array
      experiments:
        type: string
      future_work:
        items:
          type: string
        type: array
      innovations:
        items:
          type: string
        type: array
      keywords:
        items:
          type: string
        type: array
      limitations:
        items:
          type: string
        type: array
      methods:
        type: string
      paper_id:
        type: string
      publish_year:
        type: integer
      references:
        items:
          type: string
        type: array
      research_questions:
        items:
          type: string
        type: array
      results:
        type: string
      updated_at:
        type: string
      venue:
        type: string
    type: object
  model.PaperSection:
    properties:
      id:
        type: integer
      level:
        type: integer
      order_idx:
        type: integer
      page_no:
        type: integer
      paper_id:
        type: string
      title:
        type: string
      x1:
        type: number
      x2:
        type: number
      y1:
        type: number
      y2:
        type: number
    type: object
  model.Session:
    properties:
      agent_type:
        description: AgentType 标记会话由哪个 agent 应答,空为默认论文助教,pioneer 为小云雀,maodie 为小耄耋。
        type: string
      created_at:
        type: string
      id:
        type: string
      paper_id:
        type: string
      student_id:
        type: string
      title:
        type: string
      topic_id:
        description: TopicID 关联自动归类的主题,可空表示尚未归类。当前仅 pioneer 会话归类。
        type: string
      updated_at:
        type: string
    type: object
  model.Topic:
    properties:
      agent_type:
        description: AgentType 标记主题所属 agent，当前仅 pioneer，为将来扩展留口。
        type: string
      created_at:
        type: string
      id:
        type: string
      member_count:
        type: integer
      name:
        type: string
      student_id:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: '科研文献智能解析与知识服务系统后端接口。浏览器使用 HttpOnly Cookie，外部客户端可使用 Authorization:
    Bearer <jwt>。'
  title: GopherPaper API
  version: "1.0"
paths:
  /auth/token:
    post:
      consumes:
      - application/json
      description: 仅在 enable_debug_token=true、debug/test 模式且请求来自回环地址时可用。生产环境不注册该路由。
      parameters:
      - description: 签发参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 签发调试 JWT
      tags:
      - auth
  /events:
    get:
      description: 建立 SSE 长连接，推送论文解析进度与报告就绪事件。票据须先通过受保护接口获取，30 秒内只可消费一次。
      parameters:
      - description: 短期一次性票据
        in: query
        name: ticket
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 订阅事件流
      tags:
      - events
  /events/ticket:
    post:
      description: 为当前登录用户签发 30 秒有效且只能消费一次的 SSE 连接票据。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 获取 SSE 一次性票据
      tags:
      - events
  /graph/keywords:
    get:
      description: 返回当前用户知识图谱中出现次数最多的关键词。
      parameters:
      - default: 20
        description: 关键词 Top N
        in: query
        name: top
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.NameCount'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 热门关键词
      tags:
      - graph
  /graph/overview:
    get:
      description: 返回当前用户知识图谱的论文、作者、关键词、引用数量与年份跨度。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.GraphStats'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 图谱规模总览
      tags:
      - graph
  /graph/papers/{id}/related:
    get:
      description: 返回与指定论文相关的论文，关系来自共享作者、关键词、共被引、直接引用与语义相似边。
      parameters:
      - description: 论文 ID
        in: path
        name: id
        required: true
        type: string
      - default: 10
        description: 返回数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.RelatedPaper'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 查询相关论文
      tags:
      - graph
  /graph/trends:
    get:
      description: 返回每年论文数与 Top 关键词逐年热度。
      parameters:
      - default: 10
        description: 关键词 Top N
        in: query
        name: keyword_top
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.GraphTrendsResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 研究趋势
      tags:
      - graph
  /papers:
    get:
      description: 返回当前登录用户上传或导入的论文列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Paper'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 列出我的论文
      tags:
      - papers
    post:
      consumes:
      - multipart/form-data
      description: 上传 PDF 文件，创建论文记录并投递异步解析任务。文件大小上限 50MB。
      parameters:
      - description: PDF 文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Paper'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 上传论文
      tags:
      - papers
  /papers/{id}:
    delete:
      description: 删除当前用户拥有的论文及其派生数据，包括会话、报告、图片、向量索引与知识图谱节点。
      parameters:
      - description: 论文 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 删除论文
      tags:
      - papers
    get:
      description: 返回论文基础信息、结构化元信息与章节目录。
      parameters:
      - description: 论文 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaperDetailResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 获取论文详情
      tags:
      - papers
  /papers/{id}/annotations:
    get:
      description: 返回某篇论文当前用户保存的全部高亮与批注。
      parameters:
      - description: 论文 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
